<h3>Joint, marginal, and conditional probabilities from the same rolls</h3>
<p class="joint-note">Roll a fair die independently 5 times. X counts sixes and Y counts fives. The 6<sup>5</sup> = 7,776 ordered face sequences are equally likely. Rows always give X; columns always give Y.</p>
