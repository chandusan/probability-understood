<section id="prob-coin-lab" aria-label="Independent coin toss experiment">
<style>
#prob-coin-lab{min-width:0}#prob-coin-lab .controls{display:grid;gap:7px}#prob-coin-lab .buttons{display:flex;gap:7px;flex-wrap:wrap}#prob-coin-lab button{border:1px solid var(--border);background:var(--card);border-radius:5px;padding:7px 10px;cursor:pointer}#prob-coin-lab .plot{width:100%;min-width:0;margin-top:12px}#prob-coin-lab svg{width:100%;display:block}#prob-coin-lab svg text{font:11px system-ui;fill:var(--foreground)}#prob-coin-lab .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}#prob-coin-lab .stat strong{font-size:18px}#prob-coin-lab .status{font-size:12px;line-height:1.5;min-height:3em}
</style>
<h3>A long run of independent tosses</h3>
<div class="controls"><label class="form-label" for="prob-coin-p">Probability of heads: <output id="prob-coin-p-label">50%</output></label><input class="form-range" id="prob-coin-p" type="range" min="0" max="100" step="1" value="50"><div class="buttons"><button type="button" data-add="1">+1 toss</button><button type="button" data-add="100">+100</button><button type="button" data-add="1000">+1,000</button><button type="button" data-reset>New run</button></div></div>
<div class="plot"></div><div class="stats" aria-live="polite"><div class="stat">Tosses<strong data-n>0</strong></div><div class="stat">Heads<strong data-heads>0</strong></div><div class="stat">Fraction<strong data-fraction>—</strong></div></div><p class="status" role="status">Add tosses. Changing the probability starts a new run.</p>
<script>
(()=>{const root=document.getElementById('prob-coin-lab'),plot=root.querySelector('.plot'),input=root.querySelector('input');let count=0,heads=0,history=[];const teal='var(--viz-series-1)',copper='var(--viz-series-2)',border='var(--border)';
function render(){const p=+input.value/100,w=Math.max(220,plot.clientWidth||300),left=36,right=12,top=24,bottom=188,x=n=>left+n/Math.max(1,count)*(w-left-right),y=v=>bottom-v*(bottom-top);let content='';[0,.5,1].forEach(v=>{content+=`<line x1="${left}" y1="${y(v)}" x2="${w-right}" y2="${y(v)}" stroke="${border}"/><text x="${left-7}" y="${y(v)+4}" text-anchor="end">${v}</text>`});content+=`<line x1="${left}" y1="${y(p)}" x2="${w-right}" y2="${y(p)}" stroke="${copper}" stroke-width="2" stroke-dasharray="5 4"/>`;const stride=Math.max(1,Math.floor(history.length/500)),points=history.filter((_,i)=>i%stride===0||i===history.length-1);if(points.length)content+=`<polyline points="${points.map(a=>x(a[0])+','+y(a[1])).join(' ')}" fill="none" stroke="${teal}" stroke-width="2"/><circle cx="${x(count)}" cy="${y(heads/count)}" r="3.5" fill="${teal}"/>`;content+=`<text x="${left}" y="14">Head fraction</text><text x="${left}" y="209">0</text><text x="${w-right}" y="209" text-anchor="end">${count.toLocaleString()} tosses</text><text x="${left}" y="233" style="fill:${copper}">Dashed: model probability</text>`;plot.innerHTML=`<svg viewBox="0 0 ${w} 244" role="img" aria-label="Running fraction of heads compared with probability ${input.value} percent">${content}</svg>`;root.querySelector('#prob-coin-p-label').textContent=input.value+'%';root.querySelector('[data-n]').textContent=count.toLocaleString();root.querySelector('[data-heads]').textContent=heads.toLocaleString();root.querySelector('[data-fraction]').textContent=count?(heads/count).toFixed(3):'—';if(count)root.querySelector('.status').textContent=`Next toss: ${input.value}% heads, regardless of the past. Observed minus expected heads: ${(heads-count*p).toFixed(1)}.`;else root.querySelector('.status').textContent='Add tosses. Changing the probability starts a new run.';root.querySelectorAll('[data-add]').forEach(b=>b.disabled=count>=100000);}
function reset(){count=0;heads=0;history=[];render()}
root.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{const n=Math.min(+b.dataset.add,100000-count),p=+input.value/100;for(let i=0;i<n;i++){count++;heads+=Math.random()<p?1:0;history.push([count,heads/count])}render()}));root.querySelector('[data-reset]').addEventListener('click',reset);input.addEventListener('input',reset);new ResizeObserver(render).observe(plot);render();})();
</script></section>
