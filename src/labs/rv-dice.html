<h3>Track a threshold through the PMF and the CDF</h3>
<div class="rv-controls"><label for="dice-model">Distribution<select id="dice-model"><option value="standard">Two standard fair dice</option><option value="nontraditional">Nontraditional dice (slides 34–35)</option><option value="table">Values 3, 5, 8, 10 (slide 28)</option></select></label><label for="dice-threshold">Threshold t: <output id="dice-threshold-out"></output><input id="dice-threshold" type="range" min="0" max="13" step="0.5" value="7"></label></div>
<p id="dice-description" class="rv-note"></p><div id="dice-results" class="rv-results" aria-live="polite"></div>
<div class="rv-plots"><div><svg id="dice-pmf" class="rv-chart" viewBox="0 0 540 290" role="img" aria-label="Probability mass at each possible value"></svg><p class="rv-cdf-caption">PMF: each bar height is a point probability.</p></div><div><svg id="dice-cdf" class="rv-chart" viewBox="0 0 540 290" role="img" aria-label="Cumulative probability, with open and closed endpoints"></svg><p class="rv-cdf-caption">CDF: filled dots give the value at a jump; open dots give the value just before it.</p></div></div>
