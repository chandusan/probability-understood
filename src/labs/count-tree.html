<section id="count-tree-lab" aria-label="Addition and multiplication counting tree">
<style>
#count-tree-lab{min-width:0}#count-tree-lab [hidden]{display:none!important}#count-tree-lab .controls{display:grid;gap:6px}#count-tree-lab .form-label{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}#count-tree-lab .form-select{width:100%;min-width:0}#count-tree-lab .form-range{margin:5px 0 10px}#count-tree-lab .branch-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}#count-tree-lab .branch-controls .form-label{display:block}#count-tree-lab .branch-controls select{margin-top:4px}#count-tree-lab .form-check{align-items:flex-start}#count-tree-lab .form-check input{flex:0 0 auto}#count-tree-lab .plot{width:100%;min-width:0;margin-top:12px}#count-tree-lab svg{display:block;width:100%;height:auto}#count-tree-lab svg text{font:11px system-ui;fill:var(--foreground)}#count-tree-lab .result{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:12px 0}#count-tree-lab .result strong{display:block;font-size:22px;line-height:1.35}#count-tree-lab .formula,#count-tree-lab .status{font-size:12px;line-height:1.5;overflow-wrap:anywhere}#count-tree-lab .formula{margin:5px 0 0}#count-tree-lab .status{min-height:3em;margin-top:8px}#count-tree-lab .path-output{font-weight:600}#count-tree-lab .tree-key{font-size:11px;color:var(--muted-foreground);margin-top:3px}
</style>
<h3>Count complete paths through a tree</h3>
<div class="controls"><label class="form-label" for="count-tree-stages">Number of stages</label><select id="count-tree-stages" class="form-select"><option value="2">Two stages</option><option value="3">Three stages</option></select><div class="branch-controls"><label class="form-label" for="count-tree-first">First choices<select id="count-tree-first" class="form-select"><option value="2">2</option><option value="3">3</option></select></label><label class="form-label" for="count-tree-second">Second choices<select id="count-tree-second" class="form-select"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></label><label class="form-label" for="count-tree-third" data-third-control hidden>Third choices<select id="count-tree-third" class="form-select"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label></div><label class="form-check" for="count-tree-unequal"><input id="count-tree-unequal" type="checkbox"><span>Give first branch A one extra second choice</span></label></div>
<div class="result" aria-live="polite" aria-atomic="true"><span class="text-small">Complete outcomes</span><strong data-total>6</strong><p class="formula" data-formula></p></div><label class="form-label" for="count-tree-path">Trace one complete path <output class="path-output" data-path></output></label><input id="count-tree-path" class="form-range" type="range" min="1" max="6" step="1" value="1"><div class="plot"></div><p class="tree-key">Copper traces the selected path. Each final leaf is one outcome.</p><p class="status" role="status"></p>
<script>
(()=>{const root=document.getElementById('count-tree-lab'),plot=root.querySelector('.plot'),stagesInput=root.querySelector('#count-tree-stages'),firstInput=root.querySelector('#count-tree-first'),secondInput=root.querySelector('#count-tree-second'),thirdInput=root.querySelector('#count-tree-third'),unequalInput=root.querySelector('#count-tree-unequal'),pathInput=root.querySelector('#count-tree-path');
function render(){const stages=+stagesInput.value,n1=+firstInput.value,n2=+secondInput.value,n3=+thirdInput.value,unequal=unequalInput.checked,groupSizes=Array.from({length:n1},(_,i)=>n2+(unequal&&i===0?1:0)),leaves=[],nodes=[],edges=[],terminalMultiplier=stages===3?n3:1;const tree={label:'Start',depth:0,children:[],path:[]};for(let i=0;i<n1;i++){const first={label:'ABC'[i],depth:1,children:[],path:[i]};tree.children.push(first);for(let j=0;j<groupSizes[i];j++){const second={label:'ABC'[i]+(j+1),depth:2,children:[],path:[i,j]};first.children.push(second);if(stages===3)for(let k=0;k<n3;k++)second.children.push({label:'ABC'[i]+(j+1)+'abc'[k],depth:3,children:[],path:[i,j,k]});}}
function place(node){nodes.push(node);if(!node.children.length){node.leaf=leaves.length;leaves.push(node);node.y=45+node.leaf*22;}else{node.children.forEach(child=>{place(child);edges.push([node,child])});node.y=(node.children[0].y+node.children.at(-1).y)/2;}}place(tree);const total=leaves.length;pathInput.max=total;if(+pathInput.value>total)pathInput.value=total;const selected=leaves[Math.max(0,+pathInput.value-1)],w=Math.max(220,plot.clientWidth||300),left=18,right=39,x=depth=>left+depth/stages*(w-left-right),height=Math.max(125,leaves.at(-1).y+28),inPath=node=>node.path.every((v,i)=>selected.path[i]===v);let marks='';for(let d=1;d<=stages;d++)marks+=`<text x="${x(d)}" y="16" text-anchor="middle" style="font-size:10px">Step ${d}</text>`;edges.forEach(([a,b])=>{const active=inPath(b);marks+=`<line x1="${x(a.depth)}" y1="${a.y}" x2="${x(b.depth)}" y2="${b.y}" stroke="var(${active?'--viz-series-2':'--viz-series-1'})" stroke-opacity="${active?1:.27}" stroke-width="${active?2.5:1.1}"/>`});nodes.forEach(node=>{const active=inPath(node),last=node.depth===stages;marks+=`<circle cx="${x(node.depth)}" cy="${node.y}" r="${active?3.5:2.5}" fill="var(${active?'--viz-series-2':'--viz-series-1'})"/>`;if(node.depth>0)marks+=`<text x="${x(node.depth)+(last?7:0)}" y="${node.y+(last?4:-7)}" text-anchor="${last?'start':'middle'}" ${active?'font-weight="700"':''}>${node.label}</text>`});plot.innerHTML=`<svg viewBox="0 0 ${w} ${height}" role="img" aria-label="${stages}-stage counting tree with ${total} complete outcomes. First-branch group sizes are ${groupSizes.map(n=>n*terminalMultiplier).join(', ')}. Selected path ${selected.label}.">${marks}</svg>`;root.querySelector('[data-third-control]').hidden=stages!==3;root.querySelector('[data-total]').textContent=total;root.querySelector('[data-path]').textContent=selected.label;const standard=n1*n2*terminalMultiplier,formula=unequal?groupSizes.map(n=>stages===3?`${n} × ${n3}`:String(n)).join(' + '):[n1,n2,...(stages===3?[n3]:[])].join(' × ');root.querySelector('[data-formula]').textContent=formula+' = '+total;root.querySelector('.status').textContent=unequal?`Unequal branch sizes: add their totals. The unchanged product ${[n1,n2,...(stages===3?[n3]:[])].join(' × ')} = ${standard} misses ${total-standard} outcome${total-standard===1?'':'s'}.`:'Every history at a given stage has the same number of continuations, so the product counts every leaf once.';}
[stagesInput,firstInput,secondInput,thirdInput,unequalInput].forEach(input=>input.addEventListener('change',render));pathInput.addEventListener('input',render);new ResizeObserver(render).observe(plot);render();})();
</script>
</section>
