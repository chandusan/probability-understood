<section id="prob-binomial-lab" aria-label="Binomial probability explorer">
<style>
#prob-binomial-lab{min-width:0}#prob-binomial-lab .controls{display:grid;gap:6px}#prob-binomial-lab select{width:100%;min-width:0}#prob-binomial-lab .plot{width:100%;min-width:0;margin-top:10px}#prob-binomial-lab svg{width:100%;display:block}#prob-binomial-lab svg text{font:11px system-ui;fill:var(--foreground)}#prob-binomial-lab .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}#prob-binomial-lab .stat strong{font-size:17px}#prob-binomial-lab .status{font-size:12px;line-height:1.5;min-height:3em}
</style><h3>How many successes?</h3><div class="controls"><label class="form-label" for="prob-binomial-n">Trials: <output data-n-label>10</output><input id="prob-binomial-n" class="form-range" type="range" min="1" max="40" step="1" value="10"></label><label class="form-label" for="prob-binomial-model">Success model</label><select id="prob-binomial-model" class="form-select"><option value="die">Fair die: a six (p = 1/6)</option><option value="coin">Fair coin: heads (p = 1/2)</option><option value="custom">Choose a probability</option></select><div data-custom hidden><label class="form-label" for="prob-binomial-p">Success probability: <output data-p-label>20%</output><input id="prob-binomial-p" class="form-range" type="range" min="0" max="100" step="1" value="20"></label></div><label class="form-label" for="prob-binomial-k">Selected count: <output data-k-label>2</output><input id="prob-binomial-k" class="form-range" type="range" min="0" max="10" step="1" value="2"></label></div><div class="plot"></div><div class="stats" aria-live="polite"><div class="stat">P(selected)<strong data-prob></strong></div><div class="stat">Mean count<strong data-mean></strong></div><div class="stat">Variance<strong data-variance></strong></div></div><p class="status" role="status"></p>
<script>
(()=>{const root=document.getElementById('prob-binomial-lab'),plot=root.querySelector('.plot'),nInput=root.querySelector('#prob-binomial-n'),model=root.querySelector('select'),pInput=root.querySelector('#prob-binomial-p'),kInput=root.querySelector('#prob-binomial-k');function render(){const n=+nInput.value,p=model.value==='die'?1/6:model.value==='coin'?.5:+pInput.value/100;kInput.max=n;if(+kInput.value>n)kInput.value=n;const k=+kInput.value,probs=[];for(let j=0;j<=n;j++){let choose=1;for(let z=1;z<=j;z++)choose*= (n-z+1)/z;probs.push(choose*Math.pow(p,j)*Math.pow(1-p,n-j))}const w=Math.max(220,plot.clientWidth||300),left=40,right=10,top=23,bottom=174,max=Math.max(...probs)*1.12,step=(w-left-right)/(n+1),y=v=>bottom-v/max*(bottom-top);let marks='';[0,max/2,max].forEach(v=>{marks+=`<line x1="${left}" x2="${w-right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${left-5}" y="${y(v)+4}" text-anchor="end">${v.toFixed(2)}</text>`});probs.forEach((v,j)=>{marks+=`<rect x="${left+j*step+step*.12}" y="${y(v)}" width="${step*.76}" height="${Math.max(0,bottom-y(v))}" fill="var(${j===k?'--viz-series-2':'--viz-series-1'})"><title>${j} successes: ${(100*v).toFixed(3)}%</title></rect>`;if(j===0||j===n||(n<=12&&j%2===0)||(n>12&&j%10===0))marks+=`<text x="${left+(j+.5)*step}" y="193" text-anchor="middle">${j}</text>`});marks+=`<text x="${left}" y="13">Probability</text><text x="${w-right}" y="216" text-anchor="end">Success count</text>`;plot.innerHTML=`<svg viewBox="0 0 ${w} 226" role="img" aria-label="Binomial distribution with ${n} trials and success probability ${p}. Selected count ${k}, probability ${probs[k]}">${marks}</svg>`;root.querySelector('[data-custom]').hidden=model.value!=='custom';root.querySelector('[data-n-label]').textContent=n;root.querySelector('[data-k-label]').textContent=k;root.querySelector('[data-p-label]').textContent=pInput.value+'%';root.querySelector('[data-prob]').textContent=(100*probs[k]).toFixed(2)+'%';root.querySelector('[data-mean]').textContent=(n*p).toFixed(2);root.querySelector('[data-variance]').textContent=(n*p*(1-p)).toFixed(2);root.querySelector('.status').textContent=`Copper bar: exactly ${k} successes. P(at least one) = ${(100*(1-probs[0])).toFixed(2)}%. Trials are independent with the same p.`;}[nInput,pInput,kInput].forEach(i=>i.addEventListener('input',render));model.addEventListener('change',render);new ResizeObserver(render).observe(plot);render();})();
</script></section>
