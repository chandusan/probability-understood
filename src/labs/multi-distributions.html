<h3>Match a distribution to the experiment</h3>
<div class="multi-controls"><label for="dist-kind">Random experiment<select id="dist-kind"><option value="binomial">Binomial: successes in n trials</option><option value="poisson">Poisson: events in an interval</option><option value="geometric">Geometric: trial of first success</option><option value="hypergeometric">Hypergeometric: sample without replacement</option></select></label><label for="dist-n" data-parameter="n">Trials / sample size n<input id="dist-n" type="number" min="1" max="50" step="1" value="20"></label><label for="dist-p" data-parameter="p">Success probability p<input id="dist-p" type="number" min="0.05" max="1" step="0.05" value="0.3"></label><label for="dist-lambda" data-parameter="lambda" hidden>Expected count λ<input id="dist-lambda" type="number" min="0.1" max="30" step="0.1" value="4"></label><label for="dist-N" data-parameter="N" hidden>Population size N<input id="dist-N" type="number" min="2" max="100" step="1" value="30"></label><label for="dist-K" data-parameter="K" hidden>Population successes K<input id="dist-K" type="number" min="0" max="100" step="1" value="10"></label><label for="dist-k">Probability cutoff k<input id="dist-k" type="number" min="0" max="500" step="1" value="5"></label></div>
<p class="multi-note" id="dist-assumption"></p><div class="multi-stats" id="dist-results" aria-live="polite"></div><div id="dist-chart"></div><p class="multi-muted" id="dist-chart-note"></p><details><summary>See each probability</summary><div class="multi-scroll"><table class="multi-table"><thead><tr><th>Value x</th><th>P(X = x)</th></tr></thead><tbody id="dist-table"></tbody></table></div></details>
