<h3>Different paths can produce the same number of clicks</h3>
<p class="rv-note">C = click; N = no click. The first ad and any ad following N use the baseline rate. An ad following C uses the second rate. Multiply along each path, then add paths with the same click count.</p>
<div class="rv-controls"><label for="ad-base">Baseline click rate: <output id="ad-base-out"></output><input id="ad-base" type="range" min="0" max="100" step="1" value="5"></label><label for="ad-after">Click rate after a click: <output id="ad-after-out"></output><input id="ad-after" type="range" min="0" max="100" step="1" value="15"></label><label for="ad-count">Highlight a click count<select id="ad-count"><option value="all">All counts</option><option value="0">X = 0</option><option value="1">X = 1</option><option value="2">X = 2</option><option value="3">X = 3</option></select></label></div>
