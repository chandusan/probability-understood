<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change event overlap and the union</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../lab.css"><script src="../lab-frame.js"></script><link rel="stylesheet" href="../rules-labs.css"><script defer src="../rules-math.js"></script><script defer src="../rules-labs.js"></script></head><body data-lab="rules-overlap"><main class="lab-root"><div data-rules-lab="overlap">
<h3>Change the overlap and watch the union</h3>
<p class="text-small">Start with the Olympic finalist example: P(A) = 20%, P(B) = 35%, and P(A ∩ B) = 8%. The overlap control stays within the bounds of a valid probability model.</p><label class="form-label" for="event-a">P(A): <output id="event-a-value">20</output><input class="form-range" id="event-a" type="range" min="0" max="100" step="1" value="20"></label><label class="form-label" for="event-b">P(B): <output id="event-b-value">35</output><input class="form-range" id="event-b" type="range" min="0" max="100" step="1" value="35"></label><label class="form-label" for="event-both">P(A and B): <output id="event-both-value">8</output><input class="form-range" id="event-both" type="range" min="0" max="20" step="1" value="8"></label><div class="rules-result" aria-live="polite" aria-atomic="true"><span class="text-small">P(A or B), including both</span><strong id="overlap-result"></strong><p id="overlap-formula"></p></div><div id="overlap-bars" role="group" aria-label="Probabilities of four disjoint regions"></div><p id="overlap-note" class="text-small"></p>
</div>
