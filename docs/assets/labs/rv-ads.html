<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group dependent click paths into a distribution</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../lab.css"><script src="../lab-frame.js"></script><link rel="stylesheet" href="../rv-labs.css"><script defer src="../rv-math.js"></script><script defer src="../rv-labs.js"></script></head><body data-lab="rv-ads"><main class="lab-root"><h3>Different paths can produce the same number of clicks</h3>

<div class="rv-scroll"><table><thead><tr><th>Path</th><th>Clicks X</th><th>Conditional factors</th><th>Path probability</th></tr></thead><tbody id="ad-paths"></tbody></table></div>
<div id="ad-results" class="rv-results" aria-live="polite"></div><p id="ad-note" class="rv-note"></p>
