<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Which pairs of chords cross?</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../lab.css"><script src="../lab-frame.js"></script></head><body data-lab="prob-chords"><main class="lab-root"><section id="prob-chords-lab" aria-label="Random chord intersection experiment">
<style>
#prob-chords-lab{min-width:0}#prob-chords-lab .buttons{display:flex;flex-wrap:wrap;gap:7px}#prob-chords-lab button{padding:7px 10px;border:1px solid var(--border);background:var(--card);border-radius:5px;cursor:pointer}#prob-chords-lab .plot{width:100%;min-width:0}#prob-chords-lab svg{width:100%;display:block}#prob-chords-lab svg text{font:12px system-ui;fill:var(--foreground)}#prob-chords-lab .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}#prob-chords-lab .stat strong{font-size:18px}#prob-chords-lab .status{font-size:12px;line-height:1.5;min-height:3em}
</style><h3>Four uniform endpoints, two chords</h3><div class="buttons"><button type="button" data-add="1">Draw one</button><button type="button" data-add="100">+100 pairs</button><button type="button" data-add="1000">+1,000</button><button type="button" data-reset>Reset</button></div><div class="plot"></div><div class="stats" aria-live="polite"><div class="stat">Pairs<strong data-n>0</strong></div><div class="stat">Crossings<strong data-cross>0</strong></div><div class="stat">Fraction<strong data-fraction>—</strong></div></div><p class="status" role="status">Each trial samples four independent uniform angles. Target fraction: 1/3.</p>
<script>
(()=>{const root=document.getElementById('prob-chords-lab'),plot=root.querySelector('.plot');let n=0,hits=0,angles=[.6,3.3,2,4.8],cross=null;const tau=2*Math.PI,mod=a=>(a+tau)%tau;function trial(){angles=Array.from({length:4},()=>Math.random()*tau);const b=mod(angles[1]-angles[0]),c=mod(angles[2]-angles[0]),d=mod(angles[3]-angles[0]);cross=(c<b)!==(d<b);n++;if(cross)hits++;}function render(){const w=Math.max(220,plot.clientWidth||300),r=Math.min(110,(w-64)/2),cx=w/2,cy=r+30,h=cy+r+48,point=(a,rr=r)=>[cx+rr*Math.cos(a),cy-rr*Math.sin(a)],pts=angles.map(a=>point(a));let marks=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="2"/>`;[[0,1,'--viz-series-1'],[2,3,'--viz-series-2']].forEach(([a,b,c])=>{marks+=`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="var(${c})" stroke-width="2.5"/>`});const labels=[];angles.forEach((a,i)=>{let [x,y]=point(a,r+15);labels.forEach(q=>{if(Math.abs(q[0]-x)<18&&Math.abs(q[1]-y)<18)y+=y<cy?-17:17});x=Math.max(9,Math.min(w-9,x));y=Math.max(13,Math.min(h-27,y));labels.push([x,y]);marks+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="var(${i<2?'--viz-series-1':'--viz-series-2'})"/><text x="${x}" y="${y+4}" text-anchor="middle">${'ABCD'[i]}</text>`});marks+=`<text x="${cx}" y="${h-8}" text-anchor="middle">${n?(cross?'Last pair: crosses':'Last pair: does not cross'):'Illustrative pair · start a trial'}</text>`;plot.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Chords AB and CD. ${n?(cross?'They intersect inside the circle.':'They do not intersect inside the circle.'):'Illustrative placement.'}">${marks}</svg>`;root.querySelector('[data-n]').textContent=n.toLocaleString();root.querySelector('[data-cross]').textContent=hits.toLocaleString();root.querySelector('[data-fraction]').textContent=n?(hits/n).toFixed(3):'—';root.querySelector('.status').textContent=n?`Observed ${(100*hits/n).toFixed(1)}%; theoretical 33.3%. Endpoints alternate around the circle precisely when the chords cross.`:'Each trial samples four independent uniform angles. Target fraction: 1/3.';}root.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{for(let i=0;i<+b.dataset.add;i++)trial();render()}));root.querySelector('[data-reset]').addEventListener('click',()=>{n=0;hits=0;cross=null;angles=[.6,3.3,2,4.8];render()});new ResizeObserver(render).observe(plot);render();})();
</script></section>
</main></body></html>
