<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fold the angle and cross a line</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../lab.css"><script src="../lab-frame.js"></script></head><body data-lab="prob-needle"><main class="lab-root"><section id="prob-needle-lab" aria-label="Buffon needle geometry experiment">
<style>
#prob-needle-lab{min-width:0}#prob-needle-lab .controls{display:grid;gap:4px}#prob-needle-lab .form-label{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}#prob-needle-lab .form-range{margin:5px 0 12px}#prob-needle-lab .buttons{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}#prob-needle-lab button{padding:7px 10px;border:1px solid var(--border);border-radius:5px;background:var(--card);cursor:pointer}#prob-needle-lab .plot{width:100%;min-width:0}#prob-needle-lab svg{width:100%;display:block}#prob-needle-lab svg text{font:11px system-ui;fill:var(--foreground)}#prob-needle-lab .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}#prob-needle-lab .stat strong{font-size:16px}#prob-needle-lab .status{font-size:12px;line-height:1.5;min-height:3em}
</style><h3>From a tilted needle to a crossing region</h3><div class="controls"><label class="form-label" for="prob-needle-angle">Full orientation α<output data-angle>30°</output></label><input id="prob-needle-angle" class="form-range" type="range" min="0" max="180" step="1" value="30"><label class="form-label" for="prob-needle-distance">Nearest-line distance x/d<output data-distance>0.20</output></label><input id="prob-needle-distance" class="form-range" type="range" min="0" max="0.5" step="0.005" value="0.2"><label class="form-label" for="prob-needle-length">Needle length l/d<output data-length>0.75</output></label><input id="prob-needle-length" class="form-range" type="range" min="0.1" max="1" step="0.01" value="0.75"></div><div class="buttons"><button type="button" data-reflect>Reflect orientation</button><button type="button" data-random>Random drop</button></div><div class="plot"></div><div class="stats" aria-live="polite"><div class="stat">Folded angle<strong data-folded></strong></div><div class="stat">Reach / d<strong data-reach></strong></div><div class="stat">P(cross)<strong data-prob></strong></div></div><p class="status" role="status"></p>
<script>
(()=>{const root=document.getElementById('prob-needle-lab'),plot=root.querySelector('.plot'),angleInput=root.querySelector('#prob-needle-angle'),distanceInput=root.querySelector('#prob-needle-distance'),lengthInput=root.querySelector('#prob-needle-length');let sampled=null;const fixed3=v=>(Math.round((v+Number.EPSILON)*1000)/1000).toFixed(3);function render(){const alpha=sampled?sampled.alpha:+angleInput.value,distance=sampled?sampled.distance:+distanceInput.value,ratio=+lengthInput.value,theta=Math.min(alpha,180-alpha),a=alpha*Math.PI/180,reach=.5*ratio*Math.sin(a),cross=distance<=reach+1e-12,w=Math.max(220,plot.clientWidth||300),cx=w/2,scale=100,base=65,cy=base+distance*scale,dx=.5*ratio*scale*Math.cos(a),dy=.5*ratio*scale*Math.sin(a),teal='var(--viz-series-1)',copper='var(--viz-series-2)',border='var(--border)';let marks=`<text x="10" y="13" font-weight="600">The physical placement</text>`;[base,base+scale].forEach((y,i)=>{marks+=`<line x1="8" x2="${w-8}" y1="${y}" y2="${y}" stroke="${border}" stroke-width="2"/><text x="10" y="${y-7}">${i?'Next parallel line':'Nearest parallel line'}</text>`});marks+=`<line x1="${cx+61}" x2="${cx+61}" y1="${base}" y2="${cy}" stroke="${copper}" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="${cx+56}" x2="${cx+66}" y1="${base}" y2="${base}" stroke="${copper}"/><line x1="${cx+56}" x2="${cx+66}" y1="${cy}" y2="${cy}" stroke="${copper}"/><text x="${cx+70}" y="${(base+cy)/2+4}">x</text><line x1="${cx-30}" x2="${cx+30}" y1="${cy}" y2="${cy}" stroke="${border}" stroke-dasharray="3 3"/><line x1="${cx-dx}" y1="${cy+dy}" x2="${cx+dx}" y2="${cy-dy}" stroke="${cross?copper:teal}" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4" fill="var(--foreground)"/><text x="${cx}" y="194" text-anchor="middle">α = ${alpha.toFixed(1)}° → θ = ${theta.toFixed(1)}°</text>`;
const left=39,right=15,top=238,bottom=379,x=t=>left+t/90*(w-left-right),y=v=>bottom-v/.5*(bottom-top);marks+=`<text x="10" y="224" font-weight="600">All reduced outcomes (θ, x/d)</text>`;[0,.25,.5].forEach(v=>{marks+=`<line x1="${left}" x2="${w-right}" y1="${y(v)}" y2="${y(v)}" stroke="${border}"/><text x="${left-6}" y="${y(v)+4}" text-anchor="end">${v===.25?'.25':v.toFixed(1)}</text>`});const curve=Array.from({length:91},(_,t)=>`${x(t)},${y(ratio/2*Math.sin(t*Math.PI/180))}`);marks+=`<polygon points="${x(0)},${bottom} ${curve.join(' ')} ${x(90)},${bottom}" fill="${teal}" fill-opacity=".16"/><polyline points="${curve.join(' ')}" fill="none" stroke="${teal}" stroke-width="2"/>`;[0,30,60,90].forEach(t=>{marks+=`<text x="${x(t)}" y="${bottom+18}" text-anchor="middle">${t}°</text>`});marks+=`<line x1="${x(theta)}" x2="${x(theta)}" y1="${bottom}" y2="${y(distance)}" stroke="${copper}" stroke-dasharray="3 3"/><circle cx="${x(theta)}" cy="${y(distance)}" r="5" fill="${copper}" stroke="var(--background)" stroke-width="1.5"/><text x="${left}" y="${bottom+41}">Shaded: x/d ≤ (l/d) sin θ / 2</text>`;plot.innerHTML=`<svg viewBox="0 0 ${w} 433" role="img" aria-label="Needle orientation ${alpha.toFixed(1)} degrees, folded angle ${theta.toFixed(1)} degrees, nearest-line distance ${distance.toFixed(3)} times spacing, length ${ratio} times spacing. This placement ${cross?'crosses':'misses'} a line. Lower chart shows the crossing region.">${marks}</svg>`;root.querySelector('[data-angle]').textContent=alpha.toFixed(1)+'°';root.querySelector('[data-distance]').textContent=distance.toFixed(3);root.querySelector('[data-length]').textContent=ratio.toFixed(2);root.querySelector('[data-folded]').textContent=theta.toFixed(1)+'°';root.querySelector('[data-reach]').textContent=fixed3(reach);root.querySelector('[data-prob]').textContent=(100*2*ratio/Math.PI).toFixed(2)+'%';root.querySelector('.status').textContent=`${cross?'Crosses':'Misses'}: distance ${distance.toFixed(3)} ${cross?'≤':'>'} reach ${fixed3(reach)}. P(cross) averages all uniform, independent positions and angles.`;}
angleInput.addEventListener('input',()=>{if(sampled)sampled.alpha=+angleInput.value;render()});distanceInput.addEventListener('input',()=>{if(sampled)sampled.distance=+distanceInput.value;render()});lengthInput.addEventListener('input',render);root.querySelector('[data-reflect]').addEventListener('click',()=>{const current=sampled?sampled.alpha:+angleInput.value;if(sampled)sampled.alpha=180-current;angleInput.value=180-current;render()});root.querySelector('[data-random]').addEventListener('click',()=>{sampled={alpha:180*Math.random(),distance:.5*Math.random()};angleInput.value=sampled.alpha;distanceInput.value=sampled.distance;render()});new ResizeObserver(render).observe(plot);render();})();
</script></section>
</main></body></html>
